name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3 \
          python3-pip \
          python3-venv \
          gcc \
          make \
          libssl-dev \
          libzstd-dev \
          pkg-config
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          setuptools \
          wheel \
          build \
          pytest \
          pytest-cov \
          pytest-mock \
          click \
          rich \
          tomli \
          types-toml
    
    - name: Build C extensions
      run: |
        python setup.py build_ext --inplace
    
    - name: Install package in development mode
      run: |
        pip install -e .
    
    - name: Run tests with temporary directories
      env:
        PTS_DB_PATH: /tmp/pts_test.db
        PTS_SNAPSHOTS_DIR: /tmp/pts_snapshots
      run: |
        # Cria os diretórios temporários
        mkdir -p /tmp/pts_snapshots
        # Roda os testes
        python -m pytest tests/ -v --cov=src/pts --cov-report=xml --cov-report=term
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
