[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pts"
version = "1.0.0"
description = "Proteus Tool Suite - Gerenciador de pacotes universal"
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [
    {name = "Jhonatan L. Santos", email = "jhonatanlucassantosofc@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "rich>=12.0",
]

[project.scripts]
pts = "pts.cli.main:cli"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
